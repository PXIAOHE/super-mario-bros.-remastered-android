name: android-cheat

on:
  workflow_dispatch:
  push:
    branches: [ cheat ]

env:
  GODOT_VERSION: "4.4"
  EXPORT_NAME: smb1r-cheat

jobs:
  export_android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Probe environment
        run: |
          echo "HOME=$HOME"; echo "ANDROID_HOME=$ANDROID_HOME"
          godot --version || true
          ls -la /root/.local/share/godot/export_templates/ || true
          ls -la "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" || true
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls /usr/lib/jvm/ || true

      - name: Setup export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          TPLDIR="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ln -sfn "$TPLDIR" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | head -30

      - name: Write editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          network/debug/remote_host = "127.0.0.1"
          network/debug/remote_port = 6007
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Install Android build template
        run: |
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"
          ls -la "$TPL"
          mkdir -p android/build
          unzip -q -o "$TPL" -d android/build
          touch android/build/.gdignore
          test -f android/build/build.gradle && echo "build.gradle OK"
          find android/build -maxdepth 1 | head -30

      - name: Debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore "$HOME/.android/debug.keystore" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          ls -la "$HOME/.android/debug.keystore"

      - name: Fix libstdc++ for GDExtension
        run: |
          apt-get update -qq || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common >/dev/null 2>&1 || true
          add-apt-repository -y ppa:ubuntu-toolchain-r/test >/dev/null 2>&1 || true
          apt-get update -qq || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --only-upgrade libstdc++6 || true
          N=$(strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 | grep -c 'GLIBCXX_3.4.32')
          echo "GLIBCXX_3.4.32 present: $N"
          test "$N" -ge 1

      - name: Import resources
        run: |
          godot --headless --import > /tmp/import.log 2>&1 || true
          echo "=========== IMPORT TAIL ==========="
          tail -40 /tmp/import.log || true
          echo "imported files: $(ls .godot/imported 2>/dev/null | wc -l)"
          test -d .godot/imported

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" "build/${EXPORT_NAME}.apk" > /tmp/export.log 2>&1 || true
          echo "=========== ERROR LINES ==========="
          grep -inE 'error|failed|exception|not found|missing' /tmp/export.log | head -60 || true
          echo "=========== TAIL ==========="
          tail -120 /tmp/export.log || true
          echo "---- build dir ----"
          ls -la build/ || true
          test -f "build/${EXPORT_NAME}.apk"

      - name: Verify APK
        run: |
          APK="build/${EXPORT_NAME}.apk"
          test -f "$APK"
          ls -la "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs "$APK" || true
          unzip -l "$APK" | grep -E 'libgodot_android|CheatManager|project.binary' | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smb1r-cheat-apk
          path: build/*.apk
          retention-days: 7
