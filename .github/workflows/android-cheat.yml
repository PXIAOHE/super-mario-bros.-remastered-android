name: android-cheat

on:
  workflow_dispatch:
  push:
    branches: [ cheat ]

env:
  GODOT_VERSION: "4.4"
  EXPORT_NAME: smb1r-cheat

jobs:
  export_android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Probe environment
        run: |
          echo "HOME=$HOME ANDROID_HOME=$ANDROID_HOME"
          godot --version || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          java -version 2>&1 | head -2 || true

      - name: Fix libstdc++ for GDExtension
        run: |
          apt-get update -qq || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl unzip ca-certificates software-properties-common >/dev/null 2>&1 || true
          add-apt-repository -y ppa:ubuntu-toolchain-r/test >/dev/null 2>&1 || true
          apt-get update -qq || true
          for i in 1 2 3 4 5 6; do
            if DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --only-upgrade libstdc++6; then
              echo "libstdc++ upgraded on attempt $i"; break
            fi
            echo "attempt $i failed, retrying in 15s"; sleep 15; apt-get update -qq || true
          done
          command -v curl && curl --version | head -1
          N=$(grep -ac 'GLIBCXX_3.4.32' /usr/lib/x86_64-linux-gnu/libstdc++.so.6 || true)
          echo "GLIBCXX_3.4.32 present: $N"
          test "$N" -ge 1

      - name: Download official export templates
        run: |
          curl -fsSL --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          ls -la /tmp/templates.tpz
          rm -rf /tmp/tpl && mkdir -p /tmp/tpl
          unzip -q -o /tmp/templates.tpz -d /tmp/tpl
          ls /tmp/tpl/templates | head -20
          TPLDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -rf "$TPLDIR"; mkdir -p "$TPLDIR"
          cp -v /tmp/tpl/templates/android_source.zip "$TPLDIR/"
          cp -v /tmp/tpl/templates/android_debug.apk "$TPLDIR/" 2>/dev/null || true
          cp -v /tmp/tpl/templates/android_release.apk "$TPLDIR/" 2>/dev/null || true
          ls -la "$TPLDIR"

      - name: Write editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Install Android build template
        run: |
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"
          ls -la "$TPL"
          rm -rf android/build && mkdir -p android/build
          unzip -q -o "$TPL" -d android/build
          touch android/build/.gdignore
          echo "--- config.gradle ---"
          grep -E 'version_major|version_minor|version_patch|version_status|compile_sdk|target_sdk|min_sdk' android/build/config.gradle || true
          test -f android/build/build.gradle

      - name: Debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore "$HOME/.android/debug.keystore" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          ls -la "$HOME/.android/debug.keystore"

      - name: Import resources
        run: |
          godot --headless --import > /tmp/import.log 2>&1 || true
          tail -20 /tmp/import.log || true
          echo "imported files: $(ls .godot/imported 2>/dev/null | wc -l)"
          test -d .godot/imported

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" "build/${EXPORT_NAME}.apk" > /tmp/export.log 2>&1 || true
          echo "=========== ERROR LINES ==========="
          grep -inE 'error|failed|exception|not found|missing|cannot' /tmp/export.log | head -60 || true
          echo "=========== TAIL ==========="
          tail -120 /tmp/export.log || true
          ls -la build/ || true
          test -f "build/${EXPORT_NAME}.apk"

      - name: Verify APK
        run: |
          APK="build/${EXPORT_NAME}.apk"
          ls -la "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs "$APK" || true
          unzip -l "$APK" | grep -E 'libgodot_android|project.binary|assets.sparsepck' | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smb1r-cheat-apk
          path: build/*.apk
          retention-days: 7

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: |
            /tmp/export.log
            /tmp/import.log
          retention-days: 3
